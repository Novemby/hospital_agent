<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>患者手语辅助 - 无障碍智慧医疗</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic@0.5/holistic.js" crossorigin="anonymous"></script>
    <script type="importmap">
        {
            "imports": {
                "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js"
            }
        }
    </script>
    <style>
        body { background: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; }
        /* video-container 与挂号界面完全一致 */
        .video-container { position: relative; border-radius: 12px; border: 3px solid transparent; transition: border-color 0.4s ease, box-shadow 0.4s ease; }
        .video-container .video-inner { border-radius: 9px; overflow: hidden; position: relative; }
        .video-container.camera-active { border-color: #94a3b8; }
        .video-container.camera-detecting { border-color: #22c55e; box-shadow: 0 0 0 4px rgba(34,197,94,0.25), 0 0 20px rgba(34,197,94,0.3); animation: borderPulse 2s ease-in-out infinite; }
        @keyframes borderPulse { 0%,100% { box-shadow: 0 0 0 4px rgba(34,197,94,0.25), 0 0 20px rgba(34,197,94,0.2); } 50% { box-shadow: 0 0 0 6px rgba(34,197,94,0.15), 0 0 30px rgba(34,197,94,0.4); } }
        #webcam { width: 100%; display: block; }
        #canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        /* overlay 与挂号界面完全一致 */
        .overlay { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; pointer-events: none; transition: background 0.3s ease; }
        .overlay.recording { background: #ef4444; animation: pulse 1s infinite; }
        .overlay.detecting { background: linear-gradient(135deg, #7c3aed, #4f46e5); animation: pulse 1.5s ease-in-out infinite; }
        .overlay.result { background: #16a34a; font-size: 16px; font-weight: bold; padding: 6px 16px; animation: popIn 0.3s ease-out; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }
        @keyframes popIn { 0% { transform: scale(0.7); opacity: 0; } 70% { transform: scale(1.1); } 100% { transform: scale(1); opacity: 1; } }
        /* status-dot 与挂号界面完全一致 */
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #cbd5e1; flex-shrink: 0; display: inline-block; }
        .status-dot.active { background: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,0.3); animation: dotPulse 1.5s ease-in-out infinite; }
        @keyframes dotPulse { 0%,100% { box-shadow: 0 0 0 3px rgba(34,197,94,0.3); } 50% { box-shadow: 0 0 0 6px rgba(34,197,94,0.1); } }
        /* detection-dot */
        .detection-item { display: flex; align-items: center; gap: 4px; margin-bottom: 2px; }
        .detection-dot { width: 8px; height: 8px; border-radius: 50%; background: #cbd5e1; display: inline-block; }
        .detection-dot.active { background: #22c55e; }
        /* 其他 */
        .word-tag { display: inline-block; background: #dcfce7; padding: 4px 12px; border-radius: 20px; margin: 4px; font-size: 14px; }
    </style>
</head>
<body class="h-screen overflow-hidden p-0">
    <div id="app"></div>
    <script type="module" src="./js/handsign_assist.js?v=20260408-6"></script>
</body>
</html>
