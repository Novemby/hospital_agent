<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>患者手语辅助 - 无障碍智慧医疗</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic@0.5/holistic.js" crossorigin="anonymous"></script>
    <script type="importmap">
        {
            "imports": {
                "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js"
            }
        }
    </script>
    <style>
        body {
            background: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        .video-container { position: relative; aspect-ratio: 4/3; background: #000; border-radius: 12px; overflow: hidden; }
        #webcam, #canvas { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
        .overlay { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: white; padding: 4px 12px; border-radius: 20px; font-size: 12px; pointer-events: none; z-index: 10; }
        .overlay.recording { background: #ef4444; animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.7; } }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #cbd5e1; display: inline-block; margin-right: 6px; }
        .status-dot.active { background: #22c55e; }
        .word-tag { display: inline-block; background: #dcfce7; padding: 4px 12px; border-radius: 20px; margin: 4px; font-size: 14px; }
        .word-tag button { margin-left: 6px; color: #ef4444; background: none; border: none; cursor: pointer; font-size: 12px; }
        .candidate-btn { display: flex; flex-direction: column; align-items: center; padding: 8px 12px; background: white; border: 1px solid #e2e8f0; border-radius: 12px; cursor: pointer; transition: all 0.2s; min-width: 70px; }
        .candidate-btn.top1 { background: #f0fdf4; border-color: #22c55e; }
        .candidate-btn .label { font-weight: bold; }
        .candidate-btn .conf { font-size: 0.7rem; color: #64748b; }
        .auto-confirm-hint { background: #fef9c3; border-radius: 8px; padding: 8px; margin-top: 8px; }
        .countdown-progress { transition: width 1s linear; }
    </style>
</head>
<body class="p-6">
    <div id="app"></div>
    <script type="module" src="./js/handsign_assist.js"></script>
</body>
</html>
